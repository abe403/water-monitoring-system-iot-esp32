server:
  port: 8084

spring:
  application:
    name: operations-api

  datasource:
    url: ${TIMESCALE_URL:jdbc:postgresql://localhost:5432/watermonitor}
    username: ${TIMESCALE_USER:watermonitor}
    password: ${TIMESCALE_PASSWORD:watermonitor}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/watermonitor}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: ${spring.application.name}
