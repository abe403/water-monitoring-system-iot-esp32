# Pump Controller Node.
#
# The previous version exposed a bare GPIO switch with no automation linking
# it to tank level (automations.yaml was literally `[]`) and no maximum
# runtime — a relay driving a real pump with no safety cutoff was the most
# dangerous defect found in the original project audit. This version adds:
#   1. A runtime watchdog: the pump is forced off after MAX_RUNTIME regardless
#      of how it was turned on.
#   2. Dry-run protection: the pump refuses to start unless it has a recent,
#      above-floor tank level reading. This node has no level sensor of its
#      own, so it consumes the water-tank node's calibrated level over the
#      retained MQTT topic wtm/v1/water-tank-01/level/pct. That topic is only
#      published once platform/stream-processor exists (plan M6) — until then
#      this guard has no data and fails CLOSED (blocks turn-on), which is the
#      safe direction for a not-yet-implemented dependency. See
#      docs/DECISIONS/0006-dry-run-protection-fails-closed.md.
#
# KNOWN LIMITATION: unverified on real hardware since this rewrite — see the
# same note in water-level.yaml.

esphome:
  name: pump-controller
  name_add_mac_suffix: false

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  ap:
    ssid: "Pump-Controller Fallback Hotspot"
    password: !secret pump_controller_ap_password

captive_portal:

api:
  encryption:
    key: !secret pump_controller_api_encryption_key

ota:
  - platform: esphome
    password: !secret pump_controller_api_encryption_key

mqtt:
  broker: !secret mqtt_broker_host
  port: !secret mqtt_broker_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false

light:
  - platform: neopixelbus
    pin: GPIO8
    type: GRB
    variant: WS2812
    num_leds: 1
    name: "NeoPixel Light"
    id: neopixel_light
    internal: true   # driven by pump state below, not controlled directly

# ---------------------------------------------------------------------------
# Dry-run guard input: the tank node's calibrated level, consumed over MQTT.
# ---------------------------------------------------------------------------
globals:
  - id: level_last_seen_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

sensor:
  - platform: mqtt_subscribe
    id: last_known_tank_level
    name: "Tank Level (last known)"
    topic: "wtm/v1/water-tank-01/level/pct"
    qos: 1
    on_value:
      then:
        - globals.set:
            id: level_last_seen_ms
            value: "millis()"

# ---------------------------------------------------------------------------
# Pump control. `pump_relay` is the raw GPIO output and is internal (not
# exposed to the API/dashboard) so nothing can bypass the guards below by
# addressing it directly. `pump` is the entity operators and the platform's
# downlink commands (device.commands.v1) actually control.
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    pin: GPIO4
    id: pump_relay
    internal: true

  - platform: template
    name: "Pump"
    id: pump
    lambda: return id(pump_relay).state;
    turn_on_action:
      - if:
          condition:
            lambda: |-
              bool have_reading = id(last_known_tank_level).has_state() && id(level_last_seen_ms) != 0;
              bool fresh = have_reading && (millis() - id(level_last_seen_ms)) < 900000;  // 15 min
              bool above_floor = have_reading && id(last_known_tank_level).state > 5.0;
              return have_reading && fresh && above_floor;
          then:
            - switch.turn_on: pump_relay
            - light.turn_on:
                id: neopixel_light
                red: 0%
                green: 100%
                blue: 100%
            - script.execute: pump_runtime_watchdog
            - logger.log: "Pump ON (level guard passed)"
          else:
            - light.turn_on:
                id: neopixel_light
                red: 100%
                green: 0%
                blue: 0%
            - logger.log: "Pump turn-on BLOCKED: no fresh above-floor tank level reading (dry-run protection)"
    turn_off_action:
      - switch.turn_off: pump_relay
      - light.turn_off: neopixel_light
      - script.stop: pump_runtime_watchdog
      - logger.log: "Pump OFF"

script:
  - id: pump_runtime_watchdog
    mode: restart
    then:
      - delay: 10min   # tune to the real pump's duty-cycle rating before deployment
      - logger.log: "Pump runtime cutoff reached (10 min) - forcing OFF"
      - switch.turn_off: pump
