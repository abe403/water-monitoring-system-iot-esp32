[project]
name = "wtm-conservation-test"
version = "0.1.0"
description = "End-to-end telemetry conservation test for the MQTT-to-Kafka durability chain"
requires-python = ">=3.11"
dependencies = [
    "kafka-python-ng>=2.2.3",
    "paho-mqtt>=2.1",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conservation"]

[project.scripts]
wtm-conservation = "conservation.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
