[project]
name = "telemetry-ml"
version = "0.1.0"
description = "Anomaly detection training, evaluation, and inference for the water-tank telemetry platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Kept optional: the domain-facing pieces (features, baselines, evaluation
# harness, the TrainingPipeline skeleton) have no torch dependency and should
# stay importable and testable without a multi-hundred-MB install. Only the
# LSTM pipeline itself needs this.
torch = ["torch>=2.3"]
serving = ["confluent-kafka>=2.5", "fastapi>=0.111", "uvicorn>=0.30"]
mlflow = ["mlflow>=2.14"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
