listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# The most commonly missed setting in a QoS-1 durability claim: the default
# (1000) silently DISCARDS queued messages for a disconnected client past
# that count. 0 = unlimited, bounded instead by max_queued_bytes below. See
# docs/ARCHITECTURE.md, "the durability chain".
max_queued_messages 0
max_queued_bytes 26214400

persistent_client_expiration 30d
