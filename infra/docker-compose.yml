# Local development stack. NOT the durability-claim environment: a
# single-broker Kafka here cannot satisfy min.insync.replicas=2, so a "green"
# run against this compose file proves nothing about the zero-loss claim —
# see docs/ARCHITECTURE.md, "one local-environment caveat that invalidates
# naive testing". The conservation test (plan M4) runs on a 3-broker `kind`
# cluster in CI, not here. This stack exists for ordinary local development:
# running one gateway instance against one broker, iterating on the schema,
# pointing a real or simulated device at something.
name: watermonitor-dev

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: wtm-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Deliberately 1: this is dev-only. Production topic config (RF=3,
      # min.insync.replicas=2) lives in contracts/topics.yaml and is applied
      # against the 3-broker CI cluster, never against this compose file.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "wtm-dev-cluster-id-00000001"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:19092"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: wtm-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$1" --partitions "$$2" \
            --replication-factor 1 --config min.insync.replicas=1
        }
        create telemetry.raw.v1 6
        create telemetry.enriched.v1 6
        create telemetry.dlq.v1 3
        create ingest.gap.v1 3
        create anomaly.scores.v1 3

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: wtm-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: wtm-timescaledb
    environment:
      POSTGRES_DB: watermonitor
      POSTGRES_USER: watermonitor
      POSTGRES_PASSWORD: watermonitor-dev-only
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watermonitor"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: wtm-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: wtm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    container_name: wtm-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana

  ingest-gateway:
    profiles: ["apps"]
    image: localhost/wtm/ingest-gateway:dev
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: ingest-gateway
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

  stream-processor:
    profiles: ["apps"]
    image: localhost/wtm/stream-processor:dev
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: stream-processor
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      STATE_DIR: /tmp/kafka-streams
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  timescale-sink:
    profiles: ["apps"]
    image: localhost/wtm/timescale-sink:dev
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: timescale-sink
    ports:
      - "8085:8085"
    environment: &database-environment
      KAFKA_BOOTSTRAP: kafka:19092
      TIMESCALE_URL: jdbc:postgresql://timescaledb:5432/watermonitor
      TIMESCALE_USER: watermonitor
      TIMESCALE_PASSWORD: watermonitor-dev-only
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy

  alert-service:
    profiles: ["apps"]
    image: localhost/wtm/alert-service:dev
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: alert-service
    ports:
      - "8083:8083"
    environment:
      <<: *database-environment
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy

  operations-api:
    profiles: ["apps"]
    image: localhost/wtm/operations-api:dev
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: operations-api
    ports:
      - "8084:8084"
    environment:
      <<: *database-environment
      JWT_ISSUER_URI: http://localhost:8080/realms/watermonitor
      WTM_SECURITY_ENABLED: "false" # local Compose only; production default is true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy

  console:
    profiles: ["apps"]
    image: localhost/wtm/operator-console:dev
    build:
      context: ../console
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      operations-api:
        condition: service_started

volumes:
  mosquitto-data:
  timescale-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
