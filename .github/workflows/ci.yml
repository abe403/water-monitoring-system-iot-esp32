name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  console:
    name: React Operator Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install, lint, test, and build
        working-directory: console
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

  java:
    name: Java Platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        working-directory: platform
        run: sh ./gradlew build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: java-test-results
          path: platform/**/build/reports/tests/

  python-ml:
    name: Python ML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install and test
        working-directory: ml
        run: |
          pip install -e ".[dev]" -q
          pip install pytest -q
          python -m pytest tests/ -v --tb=short

  python-simulator:
    name: Python Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install and test
        working-directory: simulator
        run: |
          pip install -e ".[dev]" -q
          pip install pytest -q
          python -m pytest tests/ -v --tb=short

  conservation-oracle:
    name: Conservation Oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install and test
        working-directory: tools/chaos
        run: |
          pip install -e ".[dev]" -q
          python -m pytest tests/ -v --tb=short

  firmware-validate:
    name: ESPHome Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install 'esphome==2026.8.1' -q

      - name: Create secrets.yaml
        working-directory: firmware
        run: |
          cp secrets.yaml.example secrets.yaml
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path("secrets.yaml")
          replacements = {
              "water_level_api_encryption_key": base64.b64encode(bytes(32)).decode(),
              "pump_controller_api_encryption_key": base64.b64encode(bytes(32)).decode(),
              "water_level_ap_password": "ci-water-level-password",
              "pump_controller_ap_password": "ci-pump-controller-password",
          }
          lines = []
          for line in path.read_text().splitlines():
              name = line.split(":", 1)[0].strip()
              if name in replacements:
                  line = f'{name}: "{replacements[name]}"'
              lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Validate water-level
        working-directory: firmware
        run: esphome config water-level.yaml

      - name: Validate pump-controller
        working-directory: firmware
        run: esphome config pump-controller.yaml
