name: Durability Conservation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  three-broker-conservation:
    name: 3-broker fault conservation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install exact kind and kubectl clients
        shell: bash
        run: |
          export KIND_BIN_DIR="$RUNNER_TEMP/kind-bin"
          mkdir -p "$KIND_BIN_DIR"
          KIND_BIN_DIR="$KIND_BIN_DIR" KIND_VERSION=v0.32.0 KUBECTL_VERSION=v1.36.4 \
            bash tools/chaos/install-kind-tools.sh
          echo "$KIND_BIN_DIR" >> "$GITHUB_PATH"

      - name: Verify client versions
        run: |
          kind version
          kubectl version --client=true --output=yaml

      - name: Run conservation test with broker deletion
        env:
          CONTAINER_ENGINE: docker
          KIND_PROVIDER: docker
        run: bash tools/chaos/run-kind.sh

      - name: Upload conservation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conservation-artifacts
          path: .artifacts/
          if-no-files-found: warn
