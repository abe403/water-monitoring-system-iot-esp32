[project]
name = "wtm-simulator"
version = "0.1.0"
description = "ESP32 telemetry simulator: replays or generates synthetic multivariate readings over the same wire format the real firmware uses"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[project.scripts]
wtm-simulate = "simulator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
